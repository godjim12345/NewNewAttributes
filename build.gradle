buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        maven { url = 'https://maven.parchmentmc.org' } // Add this line
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Xmaxerrs" << "1000"
        }
    }
}
plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.disableRefMap', 'true'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "newnew_attributes.refmap.json"
    config 'newnew_attributes.mixins.json'
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {

}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs" : "${mod_id}.mixins.json"
        ])
    }

    finalizedBy 'reobfJar'
}

ext {
    github_username = 'gam0zing'
}

publishing {
    publications {
        // 使用 register 创建新的发布物
        register('mavenJava', MavenPublication) {
            // 使用组件方式，会自动包含主jar和源码jar
            from components.java

            // Maven 坐标
            groupId = 'com.gam0zing'
            artifactId = 'newnew_attributes'
            version = project.version

            // POM 信息
            pom {
                name = 'NewNew Attributes'
                description = 'A Minecraft mod for custom attributes'
                url = 'https://github.com/gam0zing/NewNewAttributes'

                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }

                developers {
                    developer {
                        id = 'gam0zing'
                        name = 'gam0zing'
                    }
                }
            }
        }
    }
    repositories {
        maven {
            name = 'githubPages'
            url = uri("../${mod_id}-maven/releases")
        }
    }
}

// 添加源码jar（可选）
task sourcesJar(type: Jar) {
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
}

build.dependsOn sourcesJar

task publishToGitHub {
    group = 'publishing'
    description = 'Publishes to GitHub Pages Maven repository'

    dependsOn 'publishAllPublicationsToGithubPagesRepository', 'generateIndexHtml'

    doLast {
        println """
✅ 已发布 ${project.version} 到 GitHub Pages 目录

📋 下一步:
1. cd ../${mod_id}-maven
2. git add .
3. git commit -m "发布 ${project.version}"
4. git push
5. 等待 GitHub Pages 部署完成
"""
    }
}

// 确保生成源码jar
java {
    withSourcesJar()
}

// 查看可用的发布任务
task showPublishingTasks {
    doLast {
        println "可用的发布任务:"
        tasks.findAll { it.name.startsWith('publish') }.each { task ->
            println "  ./gradlew ${task.name}"
        }
    }
}

// 构建并发布的一键任务
task buildAndPublish {
    group = 'publishing'
    description = 'Builds and publishes to GitHub Pages'

    dependsOn 'build', 'publishToGitHub'
}

task generateIndexHtml {
    group = 'publishing'
    description = 'Generates index.html for GitHub Pages Maven repository'

    doLast {
        def repoDir = file("../${mod_id}-maven")
        def indexFile = file("${repoDir}/index.html")

        println "🔍 搜索目录: ${repoDir}/releases/com/gam0zing/${mod_id}/"

        // 获取所有可用版本
        def versions = []
        def artifactsDir = file("${repoDir}/releases/com/gam0zing/${mod_id}")

        if (artifactsDir.exists()) {
            println "✅ 找到项目目录: ${artifactsDir.path}"

            artifactsDir.eachDir { dir ->
                println "📁 检查目录: ${dir.name}"
                if (dir.name ==~ /^\d+\.\d+\.\d+\w+$/ || dir.name ==~ /^\d+\.\d+\.\d+$/) {
                    versions << dir.name
                    println "✅ 正则匹配版本: ${dir.name}"
                } else {
                    println "❌ 跳过目录 (不是版本号): ${dir.name}"
                }
            }
        } else {
            println "❌ 项目目录不存在: ${artifactsDir.path}"
        }

        if (versions.isEmpty()) {
            println "⚠️  未找到任何版本目录"
            // 尝试更宽松的匹配
            println "🔄 尝试宽松匹配..."
            artifactsDir.eachDir { dir ->
                if (dir.name.contains('.')) {
                    versions << dir.name
                    println "✅ 宽松匹配版本: ${dir.name}"
                }
            }
        }

        // 版本排序（从新到旧）
        versions.sort { a, b ->
            try {
                def partsA = a.tokenize('.').collect { it.toInteger() }
                def partsB = b.tokenize('.').collect { it.toInteger() }
                for (int i = 0; i < Math.max(partsA.size, partsB.size); i++) {
                    def partA = i < partsA.size ? partsA[i] : 0
                    def partB = i < partsB.size ? partsB[i] : 0
                    if (partA != partB) return partB <=> partA // 降序排序
                }
                return 0
            } catch (Exception e) {
                // 如果版本号解析失败，按字符串排序
                return b.compareTo(a)
            }
        }

        def latestVersion = versions ? versions.first() : '暂无版本'

        println "📋 最终版本列表: ${versions}"
        println "🚀 最新版本: ${latestVersion}"

        // 生成 HTML 内容
        def htmlContent = generateHtmlContent(versions, latestVersion)

        // 写入文件
        indexFile.parentFile.mkdirs()
        indexFile.text = htmlContent

        println "✅ 已生成 index.html"
    }
}

// 提取 HTML 生成逻辑到单独的方法
def generateHtmlContent(versions, latestVersion) {
    def versionItems = ""
    if (versions) {
        versionItems = versions.collect { version ->
            """<div class="version-item">
                <a href="releases/com/gam0zing/${mod_id}/${version}/">${version}</a>
                ${version == latestVersion ? '<span class="latest-badge">最新</span>' : ''}
            </div>"""
        }.join('')
    } else {
        versionItems = '<div class="version-item" style="color: #999;">暂无发布版本</div>'
    }

    return """<!DOCTYPE html>
<html>
<head>
    <title>${mod_id.replace('_', ' ').toUpperCase()} Maven Repository</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container { 
            max-width: 900px; 
            margin: 0 auto; 
            background: white; 
            padding: 30px; 
            border-radius: 10px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h1 { 
            color: #333; 
            border-bottom: 3px solid #667eea; 
            padding-bottom: 10px; 
            margin-top: 0;
        }
        h2 { color: #555; }
        code { 
            background: #f8f9fa; 
            padding: 3px 6px; 
            border-radius: 4px; 
            border: 1px solid #e9ecef;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
        }
        pre { 
            background: #f8f9fa; 
            padding: 20px; 
            border-radius: 8px; 
            overflow-x: auto; 
            border: 1px solid #e9ecef;
            font-size: 14px;
            line-height: 1.4;
        }
        .version-list { 
            background: #f8f9fa; 
            padding: 15px; 
            border-radius: 8px; 
            margin: 15px 0; 
        }
        .version-item { 
            padding: 8px 12px; 
            margin: 5px 0; 
            background: white; 
            border-radius: 6px; 
            border-left: 4px solid #667eea;
        }
        .latest-badge { 
            background: #28a745; 
            color: white; 
            padding: 2px 8px; 
            border-radius: 12px; 
            font-size: 12px; 
            margin-left: 10px;
        }
        .info-box { 
            background: #e7f3ff; 
            border-left: 4px solid #1890ff; 
            padding: 15px; 
            margin: 20px 0; 
            border-radius: 6px;
        }
        a { 
            color: #667eea; 
            text-decoration: none; 
        }
        a:hover { 
            text-decoration: underline; 
        }
        .debug-info {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin: 20px 0;
            border-radius: 6px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📦 ${mod_id.replace('_', ' ').toUpperCase()} Maven Repository</h1>
        
        <div class="info-box">
            <strong>📝 说明:</strong> 这是 ${mod_id.replace('_', ' ')} 模组的 Maven 仓库，包含所有发布版本。
        </div>
        
        ${versions.isEmpty() ? '''
        <div class="debug-info">
            <strong>⚠️ 调试信息:</strong> 未检测到任何版本。请确保：
            <ul>
                <li>已运行发布任务</li>
                <li>版本目录结构正确: <code>releases/com/gam0zing/' + mod_id + '/[版本号]/</code></li>
                <li>GitHub Pages 已正确部署</li>
            </ul>
        </div>
        ''' : ''}
        
        <h2>🚀 开发者</h2>
        <p>在 <code>build.gradle</code> 中添加：</p>
        
        <pre><code>repositories {
    maven {
        name = '${mod_id.replace('_', ' ').toUpperCase()}'
        url = 'https://${github_username}.github.io/${mod_id}-maven/releases/'
    }
}

dependencies {
    implementation 'com.gam0zing:${mod_id}:${latestVersion}'
}</code></pre>

        <h2>📋 可用版本</h2>
        <div class="version-list">
            ${versionItems}
        </div>

        <h2>🔍 验证仓库</h2>
        <p>访问以下链接验证仓库状态：</p>
        <ul>
            <li><a href="releases/com/gam0zing/${mod_id}/maven-metadata.xml">maven-metadata.xml</a> - 查看所有版本信息</li>
            ${latestVersion != '暂无版本' ? '<li><a href="releases/com/gam0zing/' + mod_id + '/' + latestVersion + '/">最新版本文件</a></li>' : ''}
        </ul>
        
        <h2>📁 文件结构</h2>
        <pre>releases/com/gam0zing/${mod_id}/
├── maven-metadata.xml
└── [版本号]/
    ├── ${mod_id}-[版本号].jar
    ├── ${mod_id}-[版本号].pom
    └── ${mod_id}-[版本号]-sources.jar</pre>
        
        <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee; color: #666; font-size: 14px;">
            最后更新: ${new Date().format('yyyy-MM-dd HH:mm:ss')}
        </div>
    </div>
</body>
</html>"""
}

task debugRepoStructure {
    group = 'publishing'
    description = 'Debug the Maven repository structure'

    doLast {
        def repoDir = file("../${mod_id}-maven")
        println "🔍 调试仓库结构: ${repoDir.path}"

        if (!repoDir.exists()) {
            println "❌ 仓库目录不存在"
            return
        }

        println "📁 根目录内容:"
        repoDir.eachFile { file ->
            println "   - ${file.name} (${file.isDirectory() ? '目录' : '文件'})"
        }

        def releasesDir = file("${repoDir}/releases")
        if (releasesDir.exists()) {
            println "📁 releases 目录内容:"
            releasesDir.eachFile { file ->
                println "   - ${file.name} (${file.isDirectory() ? '目录' : '文件'})"
            }

            def projectDir = file("${releasesDir}/com/gam0zing/${mod_id}")
            if (projectDir.exists()) {
                println "📁 项目目录内容:"
                projectDir.eachFile { file ->
                    println "   - ${file.name} (${file.isDirectory() ? '目录' : '文件'})"
                }
            } else {
                println "❌ 项目目录不存在: ${projectDir.path}"
            }
        } else {
            println "❌ releases 目录不存在"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}